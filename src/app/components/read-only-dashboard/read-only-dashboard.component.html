<main class="dashboard-access">
  <header class="dashboard-access-header">
    <span>Consulta de solo lectura · {{ authService.user()?.username }}</span>
    <button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
  </header>
  @defer (on immediate) {
    <app-operations-dashboard></app-operations-dashboard>
  } @placeholder {
    <p role="status">Preparando el dashboard operativo…</p>
  }
</main>
